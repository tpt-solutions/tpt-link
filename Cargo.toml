[package]
name = "tpt-link"
description = "Shared wire layer for the TPT ecosystem: frame format, transports, sequencing, heartbeat and reconnect"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
publish = false

[features]
# Default: everything, including the transports.
default = ["std"]
# Frame encoding needs a heap buffer.
alloc = []
# Transports, Link, heartbeat, reconnect and fragmentation. Implies alloc.
std = ["alloc"]
# Serial and USB-CDC transport. serial2 is BSD-2-Clause OR Apache-2.0.
serial = ["std", "dep:serial2"]
# SocketCAN bus for Linux. socketcan is MIT. Linux only.
can-socketcan = ["std", "dep:socketcan"]
# Protobuf core messages (proto/tpt_link.proto), generated with micropb. micropb is MIT OR Apache-2.0.
proto = ["dep:micropb"]
# Authenticated, encrypted frames for links carried in the open (UDP, CAN). hmac, sha2 and chacha20poly1305 are MIT OR Apache-2.0 (RustCrypto).
auth = ["std", "dep:hmac", "dep:sha2", "dep:chacha20poly1305", "dep:getrandom"]

[dependencies]
serial2 = { version = "0.2.38", optional = true }
micropb = { version = "0.6", optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
getrandom = { version = "0.2", optional = true }
chacha20poly1305 = { version = "0.10", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
socketcan = { version = "4", default-features = false, optional = true }

[[example]]
name = "schema_roundtrip"
required-features = ["proto"]

[[bin]]
name = "tpt-link-cli"
path = "src/bin/tpt-link-cli.rs"
required-features = ["std"]

[[example]]
name = "authenticated_udp"
required-features = ["auth"]
